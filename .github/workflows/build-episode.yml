name: Build Episode

on:
  push:
    branches: [main]
    paths:
      - 'episodes/_work/**'

permissions:
  contents: write

# Never build two episodes at the same time (both would push to main).
concurrency:
  group: build-episode
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install websockets==15.0.1

      - name: Build pending episodes
        # Voices the script lines with the Realtime API (scripts/voice_segments.py), then merges them
        # with the jingles. The key is a repository secret: Settings > Secrets and variables > Actions.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/build_episode.py

      - name: Commit results
        run: |
          git config user.name "physical-ai-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes podcast.xml feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish episode [skip ci]"
          git push
