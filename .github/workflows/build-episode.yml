name: Build Episode

on:
  push:
    branches: [main]
    paths:
      - 'episodes/_work/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build pending episodes
        run: python3 scripts/build_episode.py

      - name: Commit results
        run: |
          git config user.name "physical-ai-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes podcast.xml feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish episode [skip ci]"
          git push
